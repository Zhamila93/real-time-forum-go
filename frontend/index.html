<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>The Forum — Real-Time Editorial</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <div id="app"></div>

  <!-- Auth -->
  <template id="tpl-login">
    <div class="auth-page">
      <div class="auth-card">
        <p class="auth-kicker">Account</p>
        <h1 class="auth-title">Sign In</h1>
        <form id="login-form" class="auth-form">
          <label class="field-label">Nickname or e-mail
            <input type="text" name="identifier" required autocomplete="username" />
          </label>
          <label class="field-label">Password
            <input type="password" name="password" required autocomplete="current-password" />
          </label>
          <button type="submit" class="btn btn--primary">Sign In</button>
          <p class="err" id="login-err"></p>
          <p class="switch">No account? <a href="#" data-go="register">Register</a></p>
        </form>
      </div>
    </div>
  </template>

  <template id="tpl-register">
    <div class="auth-page">
      <div class="auth-card">
        <p class="auth-kicker">Account</p>
        <h1 class="auth-title">Register</h1>
        <form id="register-form" class="auth-form">
          <label class="field-label">Nickname<input type="text" name="nickname" required /></label>
          <label class="field-label">Age<input type="number" name="age" min="1" max="150" required /></label>
          <label class="field-label">Gender
            <select name="gender" required>
              <option value="">—</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </label>
          <label class="field-label">First name<input type="text" name="first_name" required /></label>
          <label class="field-label">Last name<input type="text" name="last_name" required /></label>
          <label class="field-label">E-mail<input type="email" name="email" required autocomplete="email" /></label>
          <label class="field-label">Password (min. 6)<input type="password" name="password" minlength="6" required autocomplete="new-password" /></label>
          <button type="submit" class="btn btn--primary">Create Account</button>
          <p class="err" id="register-err"></p>
          <p class="switch">Already registered? <a href="#" data-go="login">Sign in</a></p>
        </form>
      </div>
    </div>
  </template>

  <!-- App shell -->
  <template id="tpl-main">
    <div class="layout">
      <header class="masthead" role="banner">
        <div class="masthead__inner">
          <div class="masthead__brand">
            <a href="#" data-go="feed" class="brand-link">The Forum</a>
            <p class="masthead__tagline">Real-Time Editorial</p>
          </div>
          <nav class="masthead__nav" aria-label="Primary">
            <a href="#" data-go="feed" class="nav-link">Home</a>
            <a href="#" data-go="newpost" class="nav-link">Write</a>
          </nav>
          <div class="masthead__user userbox">
            <span id="me-nick" class="userbox__nick"></span>
            <button type="button" id="logout-btn" class="btn btn--ghost">Sign Out</button>
          </div>
        </div>
        <hr class="rule rule--masthead" />
      </header>

      <div class="page-grid">
        <main class="main" id="main-content">
          <section class="content editorial-surface" id="content" aria-live="polite"></section>
        </main>
        <aside class="sidebar editorial-rail" aria-label="Members">
          <h3 class="rail-title">Members</h3>
          <hr class="rule" />
          <div id="users-list" class="users-list"></div>
        </aside>
      </div>

      <div id="chat-window" class="chat-window hidden" role="dialog" aria-label="Private message">
        <div class="chat-header">
          <span id="chat-with"></span>
          <button type="button" id="chat-close" class="chat-close" aria-label="Close">×</button>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
        <form id="chat-form" class="chat-form">
          <input type="text" id="chat-input" placeholder="Write a message…" autocomplete="off" />
          <button type="submit" class="btn btn--primary">Send</button>
        </form>
      </div>
    </div>
  </template>

  <!-- Feed -->
  <template id="tpl-feed">
    <header class="section-header">
      <p class="section-kicker">Today</p>
      <h2 class="section-title">The Feed</h2>
      <hr class="rule" />
    </header>
    <div class="filters">
      <label class="field-label field-label--inline">Section
        <select id="filter-category" class="select-editorial">
          <option value="">All Sections</option>
        </select>
      </label>
    </div>
    <div id="posts-list" class="posts-list editorial-grid" role="feed"></div>
  </template>

  <!-- New post -->
  <template id="tpl-newpost">
    <header class="section-header">
      <p class="section-kicker">Contribute</p>
      <h2 class="section-title">Submit a Story</h2>
      <hr class="rule" />
    </header>
    <form id="newpost-form" class="newpost-form compose-form">
      <label class="field-label">Headline<input type="text" name="title" required class="input-headline" /></label>
      <label class="field-label">Body<textarea name="content" rows="10" required class="input-body"></textarea></label>
      <fieldset class="fieldset-editorial">
        <legend>Sections (choose at least one)</legend>
        <div id="categories-checkboxes" class="checkbox-grid"></div>
      </fieldset>
      <button type="submit" class="btn btn--primary">Publish</button>
      <p class="err" id="newpost-err"></p>
    </form>
  </template>

  <!-- Single post -->
  <template id="tpl-post-view">
    <nav class="article-nav">
      <button type="button" class="back-btn btn btn--ghost" data-go="feed">← Back to Feed</button>
    </nav>
    <article id="single-post" class="article-body"></article>
    <hr class="rule rule--section" />
    <section class="comments comments-thread">
      <header class="comments-header">
        <h3 class="comments-title">Discussion</h3>
      </header>
      <div id="comments-list" class="comments-list"></div>
      <form id="comment-form" class="comment-compose">
        <label class="sr-only" for="comment-input">Your comment</label>
        <textarea id="comment-input" name="content" rows="3" placeholder="Join the discussion…" required></textarea>
        <button type="submit" class="btn btn--primary">Post Comment</button>
      </form>
    </section>
  </template>

  <script src="/static/js/utils.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/ws.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/posts.js"></script>
  <script src="/static/js/chat.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
