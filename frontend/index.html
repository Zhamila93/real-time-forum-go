<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>The Forum | New York Digital Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/css/styles.css?v=3" />
</head>
<body>

<div id="app"></div>

<!-- ================= LOGIN ================= -->
<template id="tpl-login">
  <section class="auth">
    <div class="auth-box">
      <div class="paper-title">THE FORUM</div>
      <p class="date">NEW YORK EDITION • REAL TIME</p>
      <h1>Sign In</h1>

      <form id="login-form">
        <label>
          Nickname or Email
          <input name="identifier" type="text" required autocomplete="username" />
        </label>

        <label>
          Password
          <input name="password" type="password" required autocomplete="current-password" />
        </label>

        <button type="submit" class="black-btn">LOGIN</button>
        <p id="login-err" class="error"></p>

        <p class="switch">
          New reader? <a href="#" data-go="register">Create account</a>
        </p>
      </form>
    </div>
  </section>
</template>

<!-- ================= REGISTER ================= -->
<template id="tpl-register">
  <section class="auth">
    <div class="auth-box">
      <div class="paper-title">THE FORUM</div>
      <p class="date">NEW YORK EDITION • REAL TIME</p>
      <h1>Create Account</h1>

      <form id="register-form">
        <label>
          Nickname
          <input name="nickname" required />
        </label>

        <label>
          Age
          <input type="number" name="age" min="1" max="150" required />
        </label>

        <label>
          Gender
          <select name="gender" required>
            <option value="">Choose</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </label>

        <label>
          First name
          <input name="first_name" required />
        </label>

        <label>
          Last name
          <input name="last_name" required />
        </label>

        <label>
          Email
          <input type="email" name="email" required autocomplete="email" />
        </label>

        <label>
          Password (min. 6)
          <input type="password" name="password" minlength="6" required autocomplete="new-password" />
        </label>

        <button type="submit" class="black-btn">REGISTER</button>
        <p id="register-err" class="error"></p>

        <p class="switch">
          Already member? <a href="#" data-go="login">Login</a>
        </p>
      </form>
    </div>
  </section>
</template>

<!-- ================= MAIN APP ================= -->
<template id="tpl-main">
  <div class="site">

    <header class="header">
      <div class="city-photo">
        <div class="overlay">
          <h1>THE FORUM</h1>
          <p>NEW YORK DIGITAL EDITION</p>
        </div>
      </div>

      <nav class="menu">
        <a href="#" data-go="feed">HOME</a>
        <a href="#" data-go="newpost">WRITE</a>
        <div class="account">
          <span id="me-nick"></span>
          <button type="button" id="logout-btn">LOGOUT</button>
        </div>
      </nav>
    </header>

    <div class="layout">
      <main id="content"></main>

      <aside class="members">
        <h3>MEMBERS</h3>
        <hr />
        <div id="users-list"></div>
      </aside>
    </div>

    <div id="chat-window" class="chat hidden">
      <div class="chat-title">
        <span id="chat-with"></span>
        <button type="button" id="chat-close">×</button>
      </div>
      <div id="chat-messages"></div>
      <form id="chat-form">
        <input id="chat-input" placeholder="Message..." autocomplete="off" />
        <button type="submit">SEND</button>
      </form>
    </div>

  </div>
</template>

<!-- ================= FEED ================= -->
<template id="tpl-feed">
  <section>
    <header class="section">
      <p>TODAY</p>
      <h2>Latest Stories</h2>
    </header>

    <select id="filter-category">
      <option value="">All categories</option>
    </select>

    <div id="posts-list"></div>
  </section>
</template>

<!-- ================= NEW POST ================= -->
<template id="tpl-newpost">
  <section>
    <header class="section">
      <p>EDITORIAL</p>
      <h2>Create Story</h2>
    </header>

    <form id="newpost-form">
      <label>
        Title
        <input name="title" required />
      </label>

      <label>
        Story
        <textarea name="content" rows="10" required></textarea>
      </label>

      <div id="categories-checkboxes"></div>

      <button type="submit" class="black-btn">PUBLISH</button>
      <p id="newpost-err" class="error"></p>
    </form>
  </section>
</template>

<!-- ================= POST ================= -->
<template id="tpl-post-view">
  <section>
    <button type="button" data-go="feed">← Back</button>

    <article id="single-post"></article>

    <hr />

    <h3>COMMENTS</h3>

    <div id="comments-list"></div>

    <form id="comment-form">
      <textarea id="comment-input" placeholder="Write comment..." required></textarea>
      <button type="submit" class="black-btn">COMMENT</button>
    </form>
  </section>
</template>

<script src="/static/js/utils.js?v=3"></script>
<script src="/static/js/api.js?v=3"></script>
<script src="/static/js/ws.js?v=3"></script>
<script src="/static/js/auth.js?v=3"></script>
<script src="/static/js/posts.js?v=3"></script>
<script src="/static/js/chat.js?v=3"></script>
<script src="/static/js/app.js?v=3"></script>

</body>
</html>
